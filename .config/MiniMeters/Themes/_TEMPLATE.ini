# READ ME FIRST:
#
# Q: What is this file?
#
# A: This file includes a brief guide to building a theme as well as itself
#    being a valid theme.
#
#    To begin making a theme, rename this file to the name of your new theme.
#    Any files in the Themes directory with an underscore (_) as the first
#    character will be ignored by MiniMeters. So be sure to remove the leading
#    underscore from the file name.
#
# ---------------------------------------------------------------
#
# All lines that begin with the hash tag (#) like this one are comments
# and ignored. Removing the hash tag from the beginning of a line that
# contains a color definition will enable that color.
#
# Commented Line:
#
#      # color_name = 100, 100, 0, 255
#
# Uncommented Line:
#
#      color_name = 100, 100, 0, 255
#
# ---------------------------------------------------------------
#
# Colors are defined similarly to how RGBA colors are defined in CSS with
# two small differences.
#
# Red in CSS with half opacity is defined like this:
#
#       rgba(255, 0, 0, 0.5)
#
# The same in MiniMeters:
#
#       255, 0, 0, 127
#
# Notice the how we forego the "rgba()" text. We also do not use a
# floating point number for the alpha channel.
#
# Note: The alpha channel value may be left out for brevity.
#
# Here are some examples of valid color definitions in MiniMeters:
#
#       color_name = 255, 60, 60, 255
#       color_name = 255, 60, 60
#       color_name = 255,60,60
#
# ---------------------------------------------------------------
# Categories:
# ---------------------------------------------------------------
#
# In MiniMeters, our theme files include categories for each meter.
#
# Categories are defined as the name of the meter surrounded by brackets.
# All colors defined below a category are "scoped" to that category.
# ---------------------------------------------------------------
#
# An example category:
#
#        [CategoryName]
#
# For example if you want to modify the primary and secondary color used in
# the Spectrum meter to be white and grey it would look like this:
#
#        [Spectrum]
#        primary = 255, 255, 255
#        secondary = 127, 127, 127
#
# ---------------------------------------------------------------
#
# Finally, before sending your theme to a friend or sharing it in the
# MiniMeters Discord server you can remove all of the commented lines just
# like this one.
#
# Be sure to add your credit string before sharing.


